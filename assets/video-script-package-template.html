<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>视频脚本</title>
  <style>
    :root {
      --bg: #fdfcfa;
      --glow: rgba(162, 120, 75, 0.08);
      --surface: rgba(255, 255, 255, 0.7);
      --surface-strong: rgba(255, 255, 255, 0.92);
      --sunken: rgba(60, 45, 30, 0.04);
      --line: rgba(25, 25, 25, 0.07);
      --edge: rgba(255, 255, 255, 0.7);
      --shadow: 0 1px 2px rgba(54, 43, 28, 0.04), 0 4px 14px rgba(54, 43, 28, 0.05);
      --shadow-lg: 0 14px 36px rgba(54, 43, 28, 0.09);
      --ink: #191919;
      --ink-2: #5d564b;
      --ink-3: #8d867b;
      --accent: #a2784b;
      --accent-soft: rgba(162, 120, 75, 0.12);
      --hot: #cf6f47;
      --hot-soft: rgba(207, 111, 71, 0.12);
      --h: #c08429;
      --h-soft: rgba(192, 132, 41, 0.13);
      --k: #4d7ca6;
      --k-soft: rgba(77, 124, 166, 0.12);
      --r: #b0627a;
      --r-soft: rgba(176, 98, 122, 0.12);
      --rh: #4f927a;
      --rh-soft: rgba(79, 146, 122, 0.13);
      --a-roll: #a2784b;
      --a-roll-soft: rgba(162, 120, 75, 0.14);
      --b-roll: #4d7ca6;
      --b-roll-soft: rgba(77, 124, 166, 0.13);
      --screen: #7a68b0;
      --screen-soft: rgba(122, 104, 176, 0.13);
      --ok: #3b8a57;
      --hook-bg: #1f1d1b;
      --hook-ink: #f4efe8;
      --hook-muted: rgba(244, 239, 232, 0.55);
      --hook-accent: #e6b980;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e0e0e;
        --glow: rgba(214, 176, 128, 0.07);
        --surface: rgba(38, 38, 38, 0.6);
        --surface-strong: rgba(48, 48, 48, 0.9);
        --sunken: rgba(255, 255, 255, 0.04);
        --line: rgba(255, 255, 255, 0.07);
        --edge: rgba(255, 255, 255, 0.05);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.12), 0 4px 14px rgba(0, 0, 0, 0.1);
        --shadow-lg: 0 14px 36px rgba(0, 0, 0, 0.3);
        --ink: #e8e6e3;
        --ink-2: #b0aba4;
        --ink-3: #7c7872;
        --accent: #d6b080;
        --accent-soft: rgba(214, 176, 128, 0.14);
        --hot: #ec8a61;
        --hot-soft: rgba(236, 138, 97, 0.15);
        --h: #e0a84f; --h-soft: rgba(224, 168, 79, 0.15);
        --k: #7eaad3; --k-soft: rgba(126, 170, 211, 0.14);
        --r: #d98ba2; --r-soft: rgba(217, 139, 162, 0.14);
        --rh: #79c2a5; --rh-soft: rgba(121, 194, 165, 0.14);
        --a-roll: #d6b080; --a-roll-soft: rgba(214, 176, 128, 0.15);
        --b-roll: #7eaad3; --b-roll-soft: rgba(126, 170, 211, 0.14);
        --screen: #a998dc; --screen-soft: rgba(169, 152, 220, 0.15);
        --ok: #6cc28a;
        --hook-bg: rgba(48, 46, 43, 0.9);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0e0e0e; --glow: rgba(214, 176, 128, 0.07); --surface: rgba(38, 38, 38, 0.6); --surface-strong: rgba(48, 48, 48, 0.9);
      --sunken: rgba(255, 255, 255, 0.04); --line: rgba(255, 255, 255, 0.07); --edge: rgba(255, 255, 255, 0.05);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.12), 0 4px 14px rgba(0, 0, 0, 0.1); --shadow-lg: 0 14px 36px rgba(0, 0, 0, 0.3);
      --ink: #e8e6e3; --ink-2: #b0aba4; --ink-3: #7c7872; --accent: #d6b080; --accent-soft: rgba(214, 176, 128, 0.14);
      --hot: #ec8a61; --hot-soft: rgba(236, 138, 97, 0.15); --h: #e0a84f; --h-soft: rgba(224, 168, 79, 0.15);
      --k: #7eaad3; --k-soft: rgba(126, 170, 211, 0.14); --r: #d98ba2; --r-soft: rgba(217, 139, 162, 0.14);
      --rh: #79c2a5; --rh-soft: rgba(121, 194, 165, 0.14); --a-roll: #d6b080; --a-roll-soft: rgba(214, 176, 128, 0.15);
      --b-roll: #7eaad3; --b-roll-soft: rgba(126, 170, 211, 0.14); --screen: #a998dc; --screen-soft: rgba(169, 152, 220, 0.15);
      --ok: #6cc28a; --hook-bg: rgba(48, 46, 43, 0.9); color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1100px 520px at 85% -12%, var(--glow), transparent 62%), var(--bg);
      color: var(--ink);
      font: 14px/1.6 "SF Pro Text", -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    h1, h2, h3, p { margin: 0; }
    .num { font-variant-numeric: tabular-nums; }
    .page { width: min(880px, 100%); margin: 0 auto; padding: 28px 16px 72px; }

    /* Header */
    .brand { display: flex; gap: 8px; align-items: center; color: var(--ink-3); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; }
    .brand img { width: 20px; height: 20px; border-radius: 6px; }
    h1 { margin-top: 12px; font-size: clamp(24px, 4.6vw, 32px); line-height: 1.25; font-weight: 700; letter-spacing: -0.01em; }
    .promise { margin-top: 8px; color: var(--ink-2); font-size: 15px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); color: var(--ink-2); font-size: 12px; font-weight: 600; white-space: nowrap; }
    .chip.warn { background: var(--h-soft); box-shadow: none; color: var(--h); }
    .chip.good { background: var(--rh-soft); box-shadow: none; color: var(--rh); }
    .brief { display: grid; gap: 8px; margin: 2px 0 14px; padding: 16px 18px; }
    .brief div { display: grid; grid-template-columns: 84px 1fr; gap: 10px; }
    .brief dt { color: var(--accent); font-size: 13px; font-weight: 600; }
    .brief dd { margin: 0; color: var(--ink-2); font-size: 13px; }

    .notice { display: flex; gap: 10px; margin-top: 18px; padding: 12px 14px; border-radius: 16px; background: var(--h-soft); color: var(--ink); font-size: 13px; }
    .notice b { flex: none; color: var(--h); }
    .notice.issues { background: var(--hot-soft); }
    .notice.issues b { color: var(--hot); }
    .notice ul { margin: 4px 0 0; padding-left: 18px; color: var(--ink-2); }

    .hook { margin: 0 0 14px; padding: 18px 20px; border-radius: 22px; background: var(--hook-bg); color: var(--hook-ink); box-shadow: var(--shadow-lg); }
    .hook-head { display: flex; justify-content: space-between; color: var(--hook-accent); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
    .hook-head span { color: var(--hook-muted); font-weight: 600; letter-spacing: 0; }
    .hook-row { display: grid; grid-template-columns: 22px 1fr; gap: 10px; margin-top: 10px; font-size: 15px; }
    .hook-row b { color: var(--hook-muted); font-weight: 600; }
    .hook-row .say { font-size: 17px; font-weight: 600; line-height: 1.5; }

    /* Tabs */
    .tabs { position: sticky; top: 0; z-index: 20; margin: 24px -16px 0; padding: 10px 16px; background: linear-gradient(var(--bg) 70%, transparent); }
    .seg { display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; border-radius: 999px; background: var(--sunken); }
    .seg button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-2); font-size: 14px; font-weight: 600; transition: background 0.18s, color 0.18s, box-shadow 0.18s; }
    .seg button[aria-selected="true"] { background: var(--surface-strong); box-shadow: var(--shadow); color: var(--ink); }
    .seg .count { color: var(--ink-3); font-size: 12px; font-weight: 600; }

    .view { margin-top: 8px; }
    .view[hidden] { display: none; }
    .view-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin: 10px 0 12px; }
    .view-head p { color: var(--ink-3); font-size: 13px; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 13px; border: 0; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); color: var(--ink); font-size: 13px; font-weight: 600; transition: background 0.15s; }
    .btn:hover { background: var(--surface-strong); }
    .btn.quiet { background: transparent; box-shadow: none; color: var(--ink-3); }
    .btn.quiet:hover { color: var(--ink); background: var(--sunken); }
    .btn svg { width: 15px; height: 15px; }
    .btn.on { background: var(--accent-soft); box-shadow: none; color: var(--accent); }

    .card { border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); -webkit-backdrop-filter: blur(22px) saturate(1.3); backdrop-filter: blur(22px) saturate(1.3); }

    /* Script */
    .beats { overflow: hidden; }
    .beat { display: grid; grid-template-columns: 54px minmax(0, 1fr) 30px; gap: 12px; padding: 16px 16px 16px 18px; border-top: 1px solid var(--line); transition: background 0.4s; }
    .beat:first-child { border-top: 0; }
    .beat.flash { background: var(--accent-soft); }
    .beat .t { color: var(--ink-3); font-size: 12px; font-weight: 600; line-height: 26px; }
    .mark { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; margin-top: 2px; padding: 0 5px; border-radius: 999px; background: var(--sunken); color: var(--ink-2); font-size: 11px; font-weight: 700; }
    .mark.big { background: var(--hot); color: #fff; }
    .line { font-size: 16px; line-height: 1.65; font-weight: 500; }
    .delivery { margin-top: 2px; color: var(--ink-3); font-size: 12px; }
    .meta { display: grid; gap: 4px; margin: 8px 0 0; font-size: 13px; color: var(--ink-2); }
    .meta > div { display: grid; grid-template-columns: 30px 1fr; gap: 6px; }
    .meta dt, .meta .k { color: var(--accent); font-size: 12px; font-weight: 600; line-height: 21px; }
    .ids { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-right: 6px; vertical-align: 1px; }
    .id { display: inline-flex; align-items: center; height: 19px; padding: 0 6px; border: 0; border-radius: 6px; background: var(--b-roll-soft); color: var(--b-roll); font: 700 11px/1 ui-monospace, "SF Mono", Menlo, monospace; }
    .id.a { background: var(--a-roll-soft); color: var(--a-roll); }
    .id.screen { background: var(--screen-soft); color: var(--screen); }
    button.id:hover { filter: brightness(0.95); text-decoration: underline; }
    .hk { display: inline-flex; gap: 2px; margin-left: 6px; vertical-align: 1px; }
    .hk i { display: inline-flex; align-items: center; justify-content: center; height: 17px; padding: 0 5px; border-radius: 5px; font: 700 10px/1 inherit; font-style: normal; }
    .hk .H { background: var(--h-soft); color: var(--h); }
    .hk .K { background: var(--k-soft); color: var(--k); }
    .hk .R { background: var(--r-soft); color: var(--r); }
    .hk .Rh { background: var(--rh-soft); color: var(--rh); }
    .check { appearance: none; display: grid; place-items: center; width: 24px; height: 24px; margin: 2px 0 0; border: 1.5px solid var(--ink-3); border-radius: 50%; opacity: 0.55; cursor: pointer; transition: all 0.15s; }
    .check:hover { opacity: 1; }
    .check::after { content: ""; width: 9px; height: 5px; margin-top: -2px; border: solid #fff; border-width: 0 0 2px 2px; transform: rotate(-45deg) scale(0); transition: transform 0.15s; }
    .check:checked { border-color: var(--ok); background: var(--ok); opacity: 1; }
    .check:checked::after { transform: rotate(-45deg) scale(1); }
    .beat.done .line, .beat.done .meta { opacity: 0.45; }

    /* Shoot */
    .progress { min-width: 220px; flex: 1 1 220px; max-width: 360px; }
    .progress-text { display: flex; justify-content: space-between; color: var(--ink-2); font-size: 13px; font-weight: 600; }
    .progress-text span { color: var(--ink-3); font-weight: 500; }
    .bar { height: 6px; margin-top: 6px; overflow: hidden; border-radius: 999px; background: var(--sunken); }
    .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--ok); transition: width 0.25s; }
    .group-title { margin: 20px 4px 8px; color: var(--ink-3); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
    .shots { display: grid; gap: 10px; }
    .shot { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; padding: 16px 18px; transition: opacity 0.2s, background 0.4s; scroll-margin-top: 80px; }
    .shot.flash { background: var(--accent-soft); }
    .shot .check { width: 26px; height: 26px; opacity: 0.7; }
    .shot-top { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
    .shot-top h3 { font-size: 15px; font-weight: 650; }
    .pri { font-size: 11px; font-weight: 700; color: var(--ink-3); }
    .pri.must { color: var(--hot); }
    .steps { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: baseline; margin-top: 8px; font-size: 13px; color: var(--ink); }
    .steps span b { margin-right: 4px; color: var(--accent); font-size: 12px; }
    .steps .arrow { color: var(--ink-3); }
    .small { margin-top: 6px; color: var(--ink-3); font-size: 12px; }
    .small code { font: 600 12px ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink-2); }
    .accept { margin-top: 6px; font-size: 13px; color: var(--ink-2); }
    .accept b { color: var(--ok); font-weight: 600; margin-right: 4px; }
    .lines { margin-top: 8px; font-size: 13px; }
    .lines summary { color: var(--accent); font-weight: 600; cursor: pointer; list-style: none; }
    .lines summary::-webkit-details-marker { display: none; }
    .lines summary::before { content: "▸ "; }
    .lines[open] summary::before { content: "▾ "; }
    .lines ol { margin: 6px 0 0; padding: 10px 12px 10px 30px; border-radius: 12px; background: var(--sunken); color: var(--ink-2); }
    .lines li { margin: 2px 0; }
    .lines li span { color: var(--ink-3); font-size: 12px; margin-right: 6px; }
    .shot.done { opacity: 0.5; }
    .shot.done h3 { text-decoration: line-through; }
    body.only-todo .shot.done { display: none; }

    /* Rhythm */
    .hkrr { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .hk-card { padding: 16px 18px; }
    .hk-card header { display: flex; align-items: center; gap: 10px; }
    .letter { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; font-weight: 800; font-size: 14px; }
    .hk-card h3 { font-size: 14px; font-weight: 650; }
    .hk-card h3 small { display: block; color: var(--ink-3); font-size: 11px; font-weight: 600; }
    .dots { margin-left: auto; display: flex; gap: 3px; align-items: center; color: var(--ink-3); font-size: 12px; font-weight: 600; }
    .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
    .dots i.on { background: currentColor; }
    .hk-card p { margin-top: 10px; font-size: 13px; color: var(--ink); }
    .hk-card p + p { margin-top: 4px; color: var(--ink-3); font-size: 12px; }
    .total { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin: 12px 4px 0; color: var(--ink-2); font-size: 13px; }
    .total b { color: var(--ink); font-size: 15px; }
    .section-title { margin: 26px 4px 10px; font-size: 15px; font-weight: 650; }
    .section-title small { margin-left: 8px; color: var(--ink-3); font-size: 12px; font-weight: 500; }
    .clock { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 18px; align-items: center; padding: 18px; }
    .dial { width: 100%; max-width: 290px; margin: 0 auto; display: block; }
    .dial .ring { fill: none; stroke: var(--line); stroke-width: 10; }
    .dial .ring2 { fill: none; stroke: var(--line); stroke-width: 1; }
    .dial .pt { fill: var(--surface-strong); stroke: var(--ink-3); stroke-width: 1.5; transition: r 0.15s; cursor: pointer; }
    .dial .pt.big { fill: var(--hot); stroke: var(--hot); }
    .dial .pt.on { stroke-width: 4; }
    .dial text { fill: var(--ink-2); font-size: 11px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .dial text.time { fill: var(--ink-3); font-size: 9.5px; font-weight: 600; }
    .dial .f1 { fill: var(--ink); font-size: 26px; font-weight: 800; }
    .dial .f2 { fill: var(--ink-3); font-size: 11px; }
    .points { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
    .points li { display: grid; grid-template-columns: 26px 38px 44px minmax(0, 1fr); gap: 8px; align-items: center; padding: 4px 8px; border-radius: 10px; font-size: 13px; transition: background 0.15s; }
    .points li.on { background: var(--sunken); }
    .points li .mark { margin: 0; }
    .points time { color: var(--ink-3); font-size: 12px; font-weight: 600; }
    .points .role { color: var(--ink-3); font-size: 11px; font-weight: 700; }
    .points li.finish { margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--line); border-radius: 0; }
    .track { padding: 18px 18px 14px; }
    .lane { position: relative; display: flex; height: 30px; margin-top: 6px; border-radius: 8px; overflow: hidden; background: var(--sunken); }
    .lane-label { display: flex; justify-content: space-between; margin-top: 10px; color: var(--ink-3); font-size: 11px; font-weight: 700; }
    .lane-label:first-child { margin-top: 0; }
    .seg-a, .seg-b { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; padding: 0 5px; overflow: hidden; border-right: 2px solid var(--bg); white-space: nowrap; font: 700 10px/1 ui-monospace, "SF Mono", Menlo, monospace; }
    .seg-a { background: var(--a-roll-soft); color: var(--a-roll); }
    .seg-b { background: var(--b-roll-soft); color: var(--b-roll); }
    .seg-b.screen { background: var(--screen-soft); color: var(--screen); }
    .ticks { position: relative; height: 22px; }
    .ticks span { position: absolute; top: 2px; transform: translateX(-50%); }
    .ticks .mark { min-width: 18px; height: 18px; font-size: 10px; padding: 0 3px; }
    .axis { display: flex; justify-content: space-between; margin-top: 6px; color: var(--ink-3); font-size: 11px; }
    .qc { padding: 6px 18px; }
    .qc div { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 13px; }
    .qc div:first-child { border-top: 0; }
    .qc dt { color: var(--ink-3); font-weight: 600; }
    .qc dd { margin: 0; color: var(--ink); }
    .qc dd b { margin-right: 6px; color: var(--hot); }
    details.sources { margin-top: 10px; padding: 0 18px; }
    details.sources summary { padding: 14px 0; color: var(--ink-2); font-size: 13px; font-weight: 600; cursor: pointer; }
    details.sources dl { margin: 0 0 12px; }

    footer.foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-top: 36px; color: var(--ink-3); font-size: 12px; }
    footer.foot span { display: inline-flex; gap: 6px; align-items: center; }
    footer.foot img { width: 16px; height: 16px; border-radius: 5px; }

    /* Overlays */
    .overlay { position: fixed; inset: 0; z-index: 50; }
    .overlay[hidden] { display: none; }
    .prompter { background: #000; color: #fff; }
    .prompter-scroll { position: absolute; inset: 0; overflow-y: auto; padding: 42vh max(24px, 8vw) 60vh; scrollbar-width: none; }
    .prompter-scroll::-webkit-scrollbar { display: none; }
    .prompter.mirror .prompter-scroll { transform: scaleX(-1); }
    .prompter p { margin: 0 0 0.9em; font-size: clamp(26px, 5.4vw, 46px); line-height: 1.5; font-weight: 600; opacity: 0.32; transition: opacity 0.25s; }
    .prompter p.now { opacity: 1; }
    .guide { position: absolute; left: 0; right: 0; top: 40vh; height: 2px; background: rgba(230, 185, 128, 0.35); pointer-events: none; }
    .prompter-bar { position: absolute; left: 50%; max-width: calc(100vw - 24px); bottom: max(18px, env(safe-area-inset-bottom)); display: flex; gap: 6px; padding: 6px; border-radius: 999px; background: rgba(40, 40, 40, 0.85); transform: translateX(-50%); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
    .prompter-bar button { height: 38px; min-width: 40px; padding: 0 12px; white-space: nowrap; border: 0; border-radius: 999px; background: transparent; color: #fff; font-size: 14px; font-weight: 600; }
    .prompter-bar button:hover, .prompter-bar button.on { background: rgba(255, 255, 255, 0.14); }
    .prompter-bar .speed { display: inline-flex; align-items: center; min-width: 44px; white-space: nowrap; justify-content: center; color: rgba(255, 255, 255, 0.6); font-size: 13px; }
    .modal { display: grid; place-items: center; padding: 16px; background: rgba(20, 16, 12, 0.42); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    .sheet { display: flex; flex-direction: column; width: min(520px, 100%); max-height: calc(100vh - 32px); border-radius: 24px; background: var(--bg); box-shadow: var(--shadow-lg); overflow: hidden; }

    let D;

    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) {} };

    /* ---------- render ---------- */
    document.title = (D.title || '视频脚本') + ' · 视频脚本';
    const hk = D.hkrr || {};
    const total = ['H', 'K', 'R', 'Rh'].reduce((n, k) => n + (Number(hk[k]?.score) || 0), 0);
    const voice = D.voice || {};
    const hookRows = script.filter((r, i) => i === 0 || Number(r.start) < 3);
    const icon = BEAV_ICON.startsWith('data:') ? '<img src="' + BEAV_ICON + '" alt="">' : '';

    const head = `
      <header>
        <div class="brand">${icon}<span>视频脚本 · ${esc(D.platform || '')}</span></div>
        <h1>${esc(D.title)}</h1>
        ${D.promise ? `<p class="promise">${esc(D.promise)}</p>` : ''}
        <div class="chips">
          <span class="chip num">时长 ${fmt(runtime)}</span>
          <span class="chip num">${script.length} 段</span>
          <span class="chip num">${shots.length} 个镜头</span>
          <span class="chip num ${total >= 15 ? '' : 'warn'}">HKRR ${total}/20</span>
          ${voice.label ? `<span class="chip ${voice.status === 'verified' ? 'good' : 'warn'}">${esc(voice.label)}</span>` : ''}
        </div>

      </header>
      ${D.example ? `<div class="notice"><b>示例</b><span>这是模板自带的示例数据，生成正式脚本时要整体替换。</span></div>` : ''}
      ${issues.length ? `<div class="notice issues"><b>数据检查</b><div>${issues.length} 处需要修<ul>${issues.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div></div>` : ''}
      ${D.fixFirst ? `<div class="notice"><b>开拍前先改</b><span>${esc(D.fixFirst)}</span></div>` : ''}
`;

    const hookCard = `${hookRows.length ? `<section class="hook" aria-label="开头 3 秒">
        <div class="hook-head">开头 3 秒<span class="num">${fmt(hookRows[0].start)}–${fmt(hookRows[hookRows.length - 1].end)}</span></div>
        <div class="hook-row"><b>说</b><span class="say">${esc(hookRows.map((r) => r.line).join(''))}</span></div>
        <div class="hook-row"><b>看</b><span>${esc(hookRows.map((r) => r.picture).filter(Boolean).join('；') || '主机位口播')}</span></div>
        ${hookRows.some((r) => r.text) ? `<div class="hook-row"><b>字</b><span>${esc(hookRows.map((r) => r.text).filter(Boolean).join(' / '))}</span></div>` : ''}
      </section>` : ''}`;
    const briefCard = `${D.core ? `<dl class="card brief">
          ${D.core.point ? `<div><dt>核心</dt><dd>${esc(D.core.point)}</dd></div>` : ''}
          ${D.core.tension ? `<div><dt>观众卡点</dt><dd>${esc(D.core.tension)}</dd></div>` : ''}
          ${D.core.proof ? `<div><dt>靠什么证明</dt><dd>${esc(D.core.proof)}</dd></div>` : ''}
        </dl>` : ''}`;
    const beatRow = (r) => {
      const ids = [r.a, ...bIds(r)].filter(Boolean);
      return `<article class="beat" id="beat-${esc(r.id)}" data-key="edit:${esc(r.id)}">
        <div><div class="t num">${fmt(r.start)}</div>${r.clock ? `<span class="mark ${BIG.has(String(r.clock)) ? 'big' : ''}" title="时钟 ${esc(r.clock)} 点">${esc(r.clock)}</span>` : ''}</div>
        <div>
          <p class="line">${esc(r.line)}</p>
          ${r.delivery ? `<p class="delivery">${esc(r.delivery)}</p>` : ''}
          <dl class="meta">
            <div><dt>画面</dt><dd style="margin:0"><span class="ids">${ids.map((id) => `<button type="button" class="id ${idClass(id)}" data-goto="${esc(id)}">${esc(id)}</button>`).join('')}</span>${esc(r.picture || '')}${r.hkrr ? `<span class="hk">${hkTags(r.hkrr)}</span>` : ''}</dd></div>
            ${r.text ? `<div><dt>花字</dt><dd style="margin:0">${esc(r.text)}</dd></div>` : ''}
            ${r.cue ? `<div><dt>剪辑</dt><dd style="margin:0">${esc(r.cue)}</dd></div>` : ''}
          </dl>
        </div>
        <input class="check" type="checkbox" aria-label="${esc(r.id)} 剪完" title="剪完勾一下">
      </article>`;
    };

    const shotCard = (s) => {
      const rowsA = script.filter((r) => r.a === s.id);
      const rowsUse = script.filter((r) => r.a === s.id || bIds(r).includes(s.id));
      const steps = [['起', s.start], ['拍', s.action], ['止', s.end]].filter((x) => x[1]);
      const small = [s.where, s.framing, s.takes].filter(Boolean).map(esc).join(' · ');
      return `<article class="card shot" id="shot-${esc(s.id)}" data-key="shot:${esc(s.id)}">
        <input class="check" type="checkbox" aria-label="${esc(s.id)} 拍完">
        <div>
          <div class="shot-top"><span class="id ${idClass(s.id)}">${esc(s.id)}</span><h3>${esc(s.what)}</h3><span class="pri ${s.priority === 'must' ? 'must' : ''}">${esc(priName[s.priority] || '')}</span></div>
          ${steps.length ? `<div class="steps">${steps.map((x) => `<span><b>${x[0]}</b>${esc(x[1])}</span>`).join('<span class="arrow">→</span>')}</div>` : ''}
          ${small ? `<p class="small">${small}</p>` : ''}
          ${s.accept ? `<p class="accept"><b>合格</b>${esc(s.accept)}</p>` : ''}
          <p class="small">${[!rowsA.length && rowsUse.length ? '用在 ' + rowsUse.map((r) => fmt(r.start)).join('、') : '', s.file ? `<code>${esc(s.file)}</code>` : '', esc(s.privacy || '')].filter(Boolean).join(' · ')}</p>
          ${rowsA.length ? `<details class="lines"><summary>这个机位要说 ${rowsA.length} 段</summary><ol>${rowsA.map((r) => `<li><span class="num">${fmt(r.start)}</span>${esc(r.line)}</li>`).join('')}</ol></details>` : ''}
        </div>
      </article>`;
    };

    const aShots = shots.filter((s) => s.type === 'A');
    const otherShots = shots.filter((s) => s.type !== 'A');

    const hkCard = (k, name, en, color) => {
      const v = hk[k] || {};
      const sc = Math.max(0, Math.min(5, Number(v.score) || 0));
      return `<article class="card hk-card">
        <header><span class="letter" style="background:var(--${color}-soft);color:var(--${color})">${k}</span><h3>${name}<small>${en}</small></h3>
        <span class="dots" style="color:var(--${color})">${[1, 2, 3, 4, 5].map((n) => `<i class="${n <= sc ? 'on' : ''}"></i>`).join('')}<span style="color:var(--ink-3);margin-left:4px">${sc}/5</span></span></header>
        ${v.effect ? `<p>${esc(v.effect)}</p>` : ''}${v.evidence ? `<p>${esc(v.evidence)}</p>` : ''}
      </article>`;
    };

    const dial = () => {
      const c = 150, R = 104;
      let svg = `<svg class="dial" viewBox="0 0 300 300" role="img" aria-label="12 点刺激时钟"><circle class="ring" cx="${c}" cy="${c}" r="${R}"/><circle class="ring2" cx="${c}" cy="${c}" r="${R - 30}"/>`;
      clock.forEach((p, i) => {
        const ang = (i / 12) * Math.PI * 2 - Math.PI / 2;
        const x = c + R * Math.cos(ang), y = c + R * Math.sin(ang);
        const tx = c + (R + 30) * Math.cos(ang), ty = c + (R + 30) * Math.sin(ang);
        const big = BIG.has(String(p.mark));
        svg += `<circle class="pt ${big ? 'big' : ''}" data-pt="${i}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${big ? 9 : 6}"><title>${esc(p.mark)} · ${esc(p.time)} · ${esc(p.label)}</title></circle>`;
        svg += `<text x="${tx.toFixed(1)}" y="${(ty - 6).toFixed(1)}">${esc(p.mark)}</text><text class="time" x="${tx.toFixed(1)}" y="${(ty + 7).toFixed(1)}">${esc(p.time)}</text>`;
      });
      const fin = D.finish || {};
      svg += `<text class="f1" x="${c}" y="${c - 8}">F</text><text class="f2" x="${c}" y="${c + 16}">${esc(fin.time || fmt(runtime))}</text></svg>`;
      return svg;
    };

    const tracks = () => {
      if (!runtime) return '';
      const pct = (t) => (Math.max(0, Math.min(runtime, Number(t))) / runtime * 100).toFixed(3) + '%';
      const a = [], b = [];
      script.forEach((r) => {
        const st = `left:${pct(r.start)};width:calc(${pct(r.end)} - ${pct(r.start)})`;
        if (r.a) {
          const prev = a[a.length - 1];
          if (prev && prev.id === r.a && Math.abs(prev.end - r.start) < 0.6) prev.end = r.end; else a.push({ id: r.a, start: r.start, end: r.end });
        }
        bIds(r).forEach((id) => b.push({ id, start: r.start, end: r.end, cls: idClass(id) }));
      });
      const seg = (cls) => (x) => `<span class="${cls} ${x.cls || ''}" style="left:${pct(x.start)};width:calc(${pct(x.end)} - ${pct(x.start)})" title="${esc(x.id)} ${fmt(x.start)}–${fmt(x.end)}">${esc(x.id)}</span>`;
      const ticks = script.filter((r) => r.clock).map((r) => `<span style="left:${pct(r.start)}"><span class="mark ${BIG.has(String(r.clock)) ? 'big' : ''}">${esc(r.clock)}</span></span>`).join('');
      const marks = [0, 0.25, 0.5, 0.75, 1].map((f) => `<span class="num">${fmt(runtime * f)}</span>`).join('');
      return `<div class="card track">
        <div class="ticks" aria-hidden="true">${ticks}</div>
        <div class="lane-label"><span>A · 口播</span></div><div class="lane">${a.map(seg('seg-a')).join('')}</div>
        <div class="lane-label"><span>B · 画面 / 录屏</span></div><div class="lane">${b.map(seg('seg-b')).join('')}</div>
        <div class="axis">${marks}</div>
      </div>`;
    };

    const qc = D.qc || {};
    const src = D.sources || {};
    const kv = (k, v, flag) => v ? `<div><dt>${k}</dt><dd>${flag ? `<b>${esc(flag)}</b>` : ''}${esc(v)}</dd></div>` : '';

    document.getElementById('app').innerHTML = `
      ${head}
      <nav class="tabs" aria-label="脚本视图">
        <div class="seg" role="tablist">
          <button type="button" role="tab" data-tab="script">逐字稿</button>
          <button type="button" role="tab" data-tab="shoot">拍摄 <span class="count num" id="tab-count"></span></button>
          <button type="button" role="tab" data-tab="rhythm">节奏</button>
        </div>
      </nav>

      <section class="view" id="view-script" role="tabpanel">
        <div class="view-head">
          <p>先出声读一遍，读着别扭就改。右侧圆圈＝这段剪完了。</p>
          <div class="actions"><button class="btn" type="button" data-act="prompter"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="12" height="9" rx="2"/><path d="M5 6.5h6M5 9h4"/></svg>提词器</button></div>
        </div>
        ${hookCard}
        <div class="card beats">${script.map(beatRow).join('')}</div>
      </section>

      <section class="view" id="view-shoot" role="tabpanel" hidden>
        <div class="view-head">
          <div class="progress"><div class="progress-text"><strong id="shoot-text"></strong><span id="shoot-left"></span></div><div class="bar"><i id="shoot-bar"></i></div></div>
          <div class="actions">
            <button class="btn" type="button" data-act="todo">只看没拍的</button>
            <button class="btn" type="button" data-act="poster"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="2" width="10" height="12" rx="2"/><path d="M6 6h4M6 9h4"/></svg>拍摄单图片</button>
          </div>
        </div>
        ${aShots.length ? `<h3 class="group-title">口播 · 按机位一次录完</h3><div class="shots">${aShots.map(shotCard).join('')}</div>` : ''}
        ${otherShots.length ? `<h3 class="group-title">画面 · 录屏 · 素材</h3><div class="shots">${otherShots.map(shotCard).join('')}</div>` : ''}
        <div class="view-head" style="margin-top:14px"><span></span><button class="btn quiet" type="button" data-act="reset">清空勾选</button></div>
      </section>

      <section class="view" id="view-rhythm" role="tabpanel" hidden>
        ${briefCard}
        <div class="hkrr">
          ${hkCard('H', '快乐', 'Happiness', 'h')}${hkCard('K', '知识', 'Knowledge', 'k')}${hkCard('R', '共鸣', 'Resonance', 'r')}${hkCard('Rh', '节奏', 'Rhythm', 'rh')}
        </div>
        <p class="total"><b class="num">HKRR ${total} / 20</b>${qc.verdict ? `<span>${esc(qc.verdict)}</span>` : ''}</p>

        <h3 class="section-title">12 点刺激时钟<small>12 / 3 / 6 / 9 是大刺激</small></h3>
        <div class="card clock">
          ${dial()}
          <ol class="points">
            ${clock.map((p, i) => `<li data-pt="${i}"><span class="mark ${BIG.has(String(p.mark)) ? 'big' : ''}">${esc(p.mark)}</span><time class="num">${esc(p.time)}</time><span class="role">${esc(p.role || '')}</span><span>${esc(p.label)}</span></li>`).join('')}
            ${D.finish ? `<li class="finish"><span class="mark">F</span><time class="num">${esc(D.finish.time || fmt(runtime))}</time><span class="role">收尾</span><span>${esc(D.finish.label || '')}</span></li>` : ''}
          </ol>
        </div>

        <h3 class="section-title">A / B 轨道<small>按时长比例</small></h3>
        ${tracks()}

        <h3 class="section-title">开拍前检查</h3>
        <dl class="card qc">
          ${kv('第一掉点', qc.dropOff?.risk, qc.dropOff?.time)}
          ${kv('AI 痕迹', qc.aiPattern)}
          ${kv('卡住拍摄', qc.blockers)}
          ${kv('作者语气', voice.note, voice.label)}
        </dl>
        ${(src.used || src.missing || src.assumptions || src.doNotClaim) ? `<details class="card sources"><summary>资料与边界</summary><dl class="qc" style="padding:0">
          ${kv('用到的资料', src.used)}${kv('还缺', src.missing)}${kv('假设', src.assumptions)}${kv('不能说', src.doNotClaim)}
        </dl></details>` : ''}
      </section>

      <footer class="foot"><span>${icon}Beav · 高留存视频脚本</span><button class="btn quiet" type="button" data-act="print">打印 / 存 PDF</button></footer>`;

    /* ---------- behaviour ---------- */
    const app = document.getElementById('app');
    const checks = [...app.querySelectorAll('[data-key] > .check')];
    const sync = () => {
      checks.forEach((c) => { const k = c.parentElement.dataset.key; c.checked = !!state.done[k]; c.parentElement.classList.toggle('done', c.checked); });
      const shotDone = shots.filter((s) => state.done['shot:' + s.id]).length;
      const mustLeft = shots.filter((s) => s.priority === 'must' && !state.done['shot:' + s.id]).length;
      app.querySelector('#tab-count').textContent = shotDone + '/' + shots.length;
      app.querySelector('#shoot-text').textContent = '已拍 ' + shotDone + ' / ' + shots.length;
      app.querySelector('#shoot-left').textContent = mustLeft ? '必拍还剩 ' + mustLeft : '必拍已拍完';
      app.querySelector('#shoot-bar').style.width = (shots.length ? shotDone / shots.length * 100 : 0) + '%';
      document.body.classList.toggle('only-todo', !!state.todo);
      app.querySelector('[data-act="todo"]').classList.toggle('on', !!state.todo);
    };
    checks.forEach((c) => c.addEventListener('change', () => { const k = c.parentElement.dataset.key; if (c.checked) state.done[k] = true; else delete state.done[k]; save(); sync(); }));

    const tabs = [...app.querySelectorAll('[data-tab]')];
    const show = (name, keepScroll) => {
      state.tab = name; save();
      tabs.forEach((t) => t.setAttribute('aria-selected', String(t.dataset.tab === name)));
      ['script', 'shoot', 'rhythm'].forEach((n) => { app.querySelector('#view-' + n).hidden = n !== name; });
      if (!keepScroll) { const nav = app.querySelector('.tabs'); if (window.scrollY > nav.offsetTop) window.scrollTo({ top: nav.offsetTop }); }
    };
    tabs.forEach((t) => t.addEventListener('click', () => show(t.dataset.tab)));
    show(['script', 'shoot', 'rhythm'].includes(state.tab) ? state.tab : 'script', true);

    const flash = (el) => { el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1200); };
    app.addEventListener('click', (e) => {
      const go = e.target.closest('[data-goto]');
      if (go) { const el = document.getElementById('shot-' + go.dataset.goto); if (el) { if (state.todo && el.classList.contains('done')) { state.todo = false; sync(); } show('shoot', true); el.scrollIntoView({ block: 'center' }); flash(el); } return; }
      const act = e.target.closest('[data-act]')?.dataset.act;
      if (act === 'todo') { state.todo = !state.todo; save(); sync(); }
      if (act === 'reset' && confirm('清空所有拍摄和剪辑勾选？')) { state.done = {}; save(); sync(); }
      if (act === 'print') window.print();
      if (act === 'prompter') openPrompter();
      if (act === 'poster') openPoster();
    });
    const pts = [...app.querySelectorAll('[data-pt]')];
    pts.forEach((el) => {
      const on = (v) => pts.filter((p) => p.dataset.pt === el.dataset.pt).forEach((p) => p.classList.toggle('on', v));
      el.addEventListener('mouseenter', () => on(true));
      el.addEventListener('mouseleave', () => on(false));
    });
    sync();

    /* ---------- prompter ---------- */
    const P = document.getElementById('prompter');
    const PS = document.getElementById('prompter-scroll');
    let playing = false, speed = 1, last = 0, acc = 0;
    PS.innerHTML = script.map((r) => `<p>${esc(r.line)}</p>`).join('');
    const paras = [...PS.children];
    const mark = () => {
      const y = window.innerHeight * 0.4;
      let best = null, bestD = Infinity;
      paras.forEach((p) => { const rc = p.getBoundingClientRect(); const d = rc.top > y ? rc.top - y : rc.bottom < y ? y - rc.bottom : 0; if (d < bestD) { bestD = d; best = p; } });
      paras.forEach((p) => p.classList.toggle('now', p === best));
    };
    const tick = (ts) => {
      if (!playing) return;
      if (last) { acc += (ts - last) / 1000 * 46 * speed; const step = Math.floor(acc); if (step) { PS.scrollTop += step; acc -= step; } }
      last = ts;
      if (PS.scrollTop + PS.clientHeight >= PS.scrollHeight - 2) setPlay(false); else requestAnimationFrame(tick);
    };
    const playBtn = P.querySelector('[data-p="play"]');
    const setPlay = (v) => { playing = v; last = 0; playBtn.textContent = v ? '暂停' : '开始'; if (v) requestAnimationFrame(tick); };
    const openPrompter = () => { P.hidden = false; document.body.style.overflow = 'hidden'; PS.scrollTop = 0; mark(); };
    const closePrompter = () => { setPlay(false); P.hidden = true; document.body.style.overflow = ''; };
    PS.addEventListener('scroll', mark, { passive: true });
    PS.addEventListener('click', () => setPlay(!playing));
    P.querySelector('.prompter-bar').addEventListener('click', (e) => {
      const a = e.target.closest('[data-p]')?.dataset.p;
      if (a === 'play') setPlay(!playing);
      if (a === 'slower' || a === 'faster') { speed = Math.max(0.4, Math.min(2.6, +(speed + (a === 'faster' ? 0.2 : -0.2)).toFixed(1))); document.getElementById('prompter-speed').textContent = speed.toFixed(1) + '×'; }
      if (a === 'mirror') { P.classList.toggle('mirror'); e.target.classList.toggle('on'); }
      if (a === 'close') closePrompter();
    });

    /* ---------- poster (field sheet PNG) ---------- */
    const M = document.getElementById('poster-modal');
    const img = document.getElementById('poster-img');
    const status = document.getElementById('poster-status');
    const saveBtn = document.getElementById('poster-save');
    let posterUrl = '';
    const closePoster = () => { M.hidden = true; document.body.style.overflow = ''; };
    document.getElementById('poster-close').addEventListener('click', closePoster);
    M.addEventListener('click', (e) => { if (e.target === M) closePoster(); });
    saveBtn.addEventListener('click', () => { const a = document.createElement('a'); a.href = posterUrl; a.download = (D.title || '视频脚本') + '-拍摄单.png'; a.click(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (!P.hidden) closePrompter(); if (!M.hidden) closePoster(); } if (e.key === ' ' && !P.hidden) { e.preventDefault(); setPlay(!playing); } });

    const openPoster = async () => {
      M.hidden = false; document.body.style.overflow = 'hidden';
      img.hidden = true; saveBtn.disabled = true; status.textContent = '正在生成…';
      try { posterUrl = await drawPoster(); img.src = posterUrl; img.hidden = false; saveBtn.disabled = false; status.textContent = '手机上长按图片也能保存'; }
      catch (err) { status.textContent = '生成失败：' + err.message; }
    };

    const drawPoster = async () => {
      const W = 1080, PAD = 64, CW = W - PAD * 2;
      const FONT = '-apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif';
      const C = { bg: '#fdfcfa', ink: '#191919', ink2: '#5d564b', ink3: '#8d867b', line: 'rgba(25,25,25,0.08)', card: '#ffffff', accent: '#a2784b', hot: '#cf6f47', ok: '#3b8a57', a: '#a2784b', b: '#4d7ca6', screen: '#7a68b0' };
      const cv = document.getElementById('poster');
      const ctx = cv.getContext('2d');
      const wrap = (text, font, width) => {
        ctx.font = font; const out = []; let cur = '';
        for (const ch of String(text || '')) { if (ctx.measureText(cur + ch).width > width && cur) { out.push(cur); cur = ch; } else cur += ch; }
        if (cur) out.push(cur); return out;
      };
      const ops = []; let y = PAD;
      const text = (s, x, yy, font, color, align) => ops.push(() => { ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'top'; ctx.fillText(s, x, yy); });
      const para = (s, x, font, color, width, lh) => { wrap(s, font, width).forEach((l) => { text(l, x, y, font, color); y += lh; }); };
      const rect = (x, yy, w, h, r, fill, stroke) => ops.push(() => { ctx.beginPath(); ctx.roundRect(x, yy, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); } });
      let logo = null;
      if (BEAV_ICON.startsWith('data:')) { logo = new Image(); logo.src = BEAV_ICON; try { await logo.decode(); } catch (_) { logo = null; } }

      if (logo) ops.push(() => ctx.drawImage(logo, PAD, PAD, 40, 40));
      text('拍摄单 · ' + (D.platform || ''), PAD + (logo ? 54 : 0), PAD + 8, `600 24px ${FONT}`, C.ink3);
      y += 64;
      para(D.title || '', PAD, `700 48px ${FONT}`, C.ink, CW, 64);
      y += 6;
      const done = shots.filter((s) => state.done['shot:' + s.id]).length;
      text(`时长 ${fmt(runtime)}  ·  ${shots.length} 个镜头  ·  已拍 ${done}/${shots.length}  ·  HKRR ${total}/20`, PAD, y, `600 24px ${FONT}`, C.ink2); y += 52;

      // opening 3 seconds
      const hookLines = wrap(hookRows.map((r) => r.line).join(''), `600 30px ${FONT}`, CW - 60);
      const hookH = 70 + hookLines.length * 44;
      rect(PAD, y, CW, hookH, 28, '#1f1d1b');
      text('开头 3 秒', PAD + 30, y + 24, `700 22px ${FONT}`, '#e6b980');
      hookLines.forEach((l, i) => text(l, PAD + 30, y + 60 + i * 44, `600 30px ${FONT}`, '#f4efe8'));
      y += hookH + 36;

      // clock compact: two columns
      text('节奏 · 12 点刺激时钟', PAD, y, `700 26px ${FONT}`, C.ink); y += 46;
      const colW = (CW - 24) / 2;
      const half = Math.ceil(clock.length / 2);
      const clockTop = y; let maxY = y;
      clock.forEach((p, i) => {
        const col = i < half ? 0 : 1; const row = i < half ? i : i - half;
        const x = PAD + col * (colW + 24), yy = clockTop + row * 46;
        const big = BIG.has(String(p.mark));
        rect(x, yy + 2, 34, 34, 17, big ? C.hot : '#efebe5');
        text(String(p.mark), x + 17, yy + 9, `700 18px ${FONT}`, big ? '#fff' : C.ink2, 'center');
        text(String(p.time || ''), x + 46, yy + 8, `600 20px ${FONT}`, C.ink3);
        const lab = wrap(p.label, `500 22px ${FONT}`, colW - 112)[0] || '';
        text(lab, x + 108, yy + 7, `500 22px ${FONT}`, C.ink);
        maxY = Math.max(maxY, yy + 46);
      });
      y = maxY + 30;

      // shots
      text('镜头清单', PAD, y, `700 26px ${FONT}`, C.ink); y += 46;
      shots.forEach((s) => {
        const isDone = !!state.done['shot:' + s.id];
        const what = wrap(s.what, `650 26px ${FONT}`, CW - 190);
        const how = wrap([s.start, s.action, s.end].filter(Boolean).join(' → '), `400 21px ${FONT}`, CW - 110);
        const meta = wrap([s.framing, s.takes, s.file].filter(Boolean).join(' · '), `400 19px ${FONT}`, CW - 110);
        const h = 36 + what.length * 36 + how.length * 30 + meta.length * 27 + 8;
        rect(PAD, y, CW, h, 22, C.card, C.line);
        rect(PAD + 26, y + 24, 30, 30, 15, isDone ? C.ok : null, isDone ? null : '#c9c2b8');
        if (isDone) text('✓', PAD + 41, y + 27, `700 20px ${FONT}`, '#fff', 'center');
        const col = s.type === 'A' ? C.a : s.type === 'screen' ? C.screen : C.b;
        text(s.id, PAD + 76, y + 24, `700 22px ui-monospace, Menlo, monospace`, col);
        let yy = y + 20;
        what.forEach((l) => { text(l, PAD + 150, yy, `650 26px ${FONT}`, C.ink); yy += 36; });
        if (s.priority === 'must') text('必拍', PAD + CW - 26, y + 24, `700 20px ${FONT}`, C.hot, 'right');
        how.forEach((l) => { text(l, PAD + 76, yy + 2, `400 21px ${FONT}`, C.ink2); yy += 30; });
        meta.forEach((l) => { text(l, PAD + 76, yy + 4, `400 19px ${FONT}`, C.ink3); yy += 27; });
        y += h + 14;
      });
      y += 20;
      text('Beav · 高留存视频脚本', W / 2, y, `600 20px ${FONT}`, C.ink3, 'center'); y += 30 + PAD - 20;

      cv.width = W; cv.height = Math.ceil(y);
      ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, cv.height);
      ops.forEach((f) => f());
      return cv.toDataURL('image/png');
    };
  })();
  </script>
</body>
</html>
